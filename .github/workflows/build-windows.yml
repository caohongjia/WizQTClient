name: Build Windows EXE

on:
  push:
    branches: [master, main, 'ci-windows-build', 'trae/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to use'
        required: false
        default: '5.15.2'
        type: string

jobs:
  build-windows:
    name: Build WizNote for Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout 源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Qt 5.15 via aqt 3.x
      - name: Install Qt 5.15 via aqtinstall
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0"

          $QtVersion = "${{ inputs.qt_version }}"
          if ([string]::IsNullOrEmpty($QtVersion)) { $QtVersion = "5.15.2" }

          Write-Host "Installing Qt $QtVersion windows desktop msvc2019_64 ..."
          python -m aqt install-qt windows desktop $QtVersion msvc2019_64

          # aqt 目录名可能带或不带 win64_ 前缀, 探测实际安装位置
          $qtRoot = "C:\Qt\$QtVersion"
          Write-Host "Qt root contents:"
          Get-ChildItem $qtRoot -ErrorAction SilentlyContinue

          $QtPath = $null
          foreach ($archDir in Get-ChildItem $qtRoot -Directory -ErrorAction SilentlyContinue) {
            $qmake = Join-Path $archDir.FullName "bin\qmake.exe"
            Write-Host "  checking: $qmake"
            if (Test-Path $qmake) {
              $QtPath = $archDir.FullName
              Write-Host "FOUND Qt at: $QtPath"
              break
            }
          }

          if (-not $QtPath) {
            Write-Host "Fallback: searching entire C:\Qt for qmake.exe ..."
            $found = Get-ChildItem -Path "C:\Qt" -Filter "qmake.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $QtPath = Split-Path $found.FullName -Parent | Split-Path -Parent
              Write-Host "Detected Qt path: $QtPath"
            }
          }

          if (-not $QtPath) {
            Write-Error "FAILED: qmake.exe not found anywhere under C:\Qt!"
            exit 1
          }

          # 导出 Qt 路径给后续 step
          echo "QT_PATH=$QtPath" >> $env:GITHUB_ENV
          & "$QtPath\bin\qmake.exe" --version

      # 3. 下载预编译 OpenSSL
      - name: Install OpenSSL (prebuilt)
        shell: powershell
        run: |
          $OpenSslUrl = "https://slproweb.com/download/Win64OpenSSL-1_1_1w.msi"
          $OpenSslMsi = "$env:TEMP\Win64OpenSSL.msi"

          Write-Host "Downloading OpenSSL ..."
          Invoke-WebRequest -Uri $OpenSslUrl -OutFile $OpenSslMsi -UseBasicParsing

          Write-Host "Installing OpenSSL ..."
          Start-Process msiexec.exe -ArgumentList '/i', $OpenSslMsi, '/quiet', '/qn' -Wait

          # 探测 OpenSSL 安装位置
          $OpenSslRoot = $null
          foreach ($candidate in @("C:\OpenSSL-Win64", "C:\Program Files\OpenSSL-Win64", "C:\OpenSSL")) {
            if (Test-Path "$candidate\include\openssl\ssl.h") {
              $OpenSslRoot = $candidate
              Write-Host "Found OpenSSL at: $OpenSslRoot"
              break
            }
          }

          if (-not $OpenSslRoot) {
            Write-Warning "OpenSSL headers not found, searching ..."
            $found = Get-ChildItem -Path "C:\" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "openssl" } | Select-Object -First 1
            if ($found) {
              $OpenSslRoot = Split-Path $found.DirectoryName -Parent
              Write-Host "Detected OpenSSL at: $OpenSslRoot"
            } else {
              Write-Warning "OpenSSL not found, build may fail"
              $OpenSslRoot = "C:\OpenSSL-Win64"
            }
          }
          echo "OPENSSL_ROOT=$OpenSslRoot" >> $env:GITHUB_ENV

      # 4. CMake 配置 (使用 cmd, 加载 MSVC 环境)
      - name: CMake Configure
        shell: cmd
        env:
          QT_PATH: ${{ env.QT_PATH }}
          OPENSSL_ROOT: ${{ env.OPENSSL_ROOT }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul
          if errorlevel 1 (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" 2>nul
          )

          echo QT_PATH=%QT_PATH%
          echo OPENSSL_ROOT=%OPENSSL_ROOT%

          if not exist build mkdir build
          cd build

          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_PREFIX_PATH="%QT_PATH%" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT%" ^
            -DOPENSSL_INCLUDE_DIR="%OPENSSL_ROOT%\include" ^
            -DOPENSSL_LIBRARIES="%OPENSSL_ROOT%\lib" ^
            .. || echo "CMake configure FAILED" && exit /b 1

      # 5. 编译
      - name: CMake Build
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel 4 || echo "Build FAILED" && exit /b 1
          echo "Build succeeded!"
          dir Release\*.exe 2>nul

      # 6. 部署 Qt 运行时
      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        env:
          QT_PATH: ${{ env.QT_PATH }}
        run: |
          set QT_BIN=%QT_PATH%\bin
          set EXE_DIR=build\Release

          if not exist "%EXE_DIR%\WizNote.exe" (
            echo "WizNote.exe not found! Listing build output:"
            dir build\Release
            dir build\src\Release 2>nul
            exit /b 1
          )

          "%QT_BIN%\windeployqt.exe" --release --no-translations --no-opengl-sw "%EXE_DIR%\WizNote.exe"
          echo "windeployqt done"
          dir "%EXE_DIR%" /B | find /c /v ""

      # 7. 拷贝 OpenSSL DLL 和 share 资源
      - name: Copy OpenSSL DLLs and share resources
        shell: cmd
        env:
          OPENSSL_ROOT: ${{ env.OPENSSL_ROOT }}
        run: |
          set EXE_DIR=build\Release
          copy /Y "%OPENSSL_ROOT%\bin\libcrypto-1_1-x64.dll" "%EXE_DIR%\" 2>nul
          copy /Y "%OPENSSL_ROOT%\bin\libssl-1_1-x64.dll" "%EXE_DIR%\" 2>nul
          copy /Y "%OPENSSL_ROOT%\bin\libcrypto-3-x64.dll" "%EXE_DIR%\" 2>nul
          copy /Y "%OPENSSL_ROOT%\bin\libssl-3-x64.dll" "%EXE_DIR%\" 2>nul

          if exist share xcopy /E /I /Y share "%EXE_DIR%\share"

      # 8. 打包
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path "build\Release\*" -DestinationPath "WizNote-Windows-x64.zip" -Force
          Get-Item "WizNote-Windows-x64.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      # 9. 上传
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizNote-Windows-x64
          path: WizNote-Windows-x64.zip
          if-no-files-found: error
