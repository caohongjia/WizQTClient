name: Build Windows EXE

on:
  push:
    branches: [master, main, 'trae/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to use'
        required: false
        default: '5.12.8'
        type: string
      msvc_version:
        description: 'MSVC version for Qt (msvc2017_64 or msvc2019_64)'
        required: false
        default: 'msvc2017_64'
        type: string

jobs:
  build-windows:
    name: Build WizNote for Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout 源码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装 Qt (通过 aqtinstall)
      - name: Install Qt via aqtinstall
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          
          $QtVersion = "${{ inputs.qt_version }}"
          $MsvcArch  = "${{ inputs.msvc_version }}"
          
          Write-Host "Installing Qt $QtVersion for $MsvcArch ..."
          python -m aqt install-qt windows desktop $QtVersion $MsvcArch `
            -m qtwebengine qtwebsockets qtwebchannel qtsvg qttools qtbase
          
          Write-Host "Qt installed at: C:\Qt\$QtVersion\$MsvcArch"
          Get-ChildItem "C:\Qt\$QtVersion\$MsvcArch\bin" | Select-Object -First 10

      # 3. 安装 OpenSSL (Windows 需要)
      - name: Install OpenSSL via vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install openssl:x64-windows --recurse
          .\vcpkg integrate install
          Write-Host "OpenSSL installed"

      # 4. 配置 CMake
      - name: CMake Configure
        shell: powershell
        env:
          QT_VERSION: ${{ inputs.qt_version }}
          MSVC_ARCH: ${{ inputs.msvc_version }}
        run: |
          $QtPath = "C:\Qt\$env:QT_VERSION\$env:MSVC_ARCH"
          $OpenSslDir = "C:\vcpkg\installed\x64-windows"
          
          New-Item -ItemType Directory -Force build | Out-Null
          Push-Location build
          
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$QtPath" `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENSSL_ROOT_DIR="$OpenSslDir" `
            -DOPENSSL_INCLUDE_DIR="$OpenSslDir\include" `
            -DOPENSSL_LIBRARIES="$OpenSslDir\lib" `
            ..
          
          Pop-Location

      # 5. 编译
      - name: CMake Build
        shell: powershell
        run: |
          cmake --build build --config Release --parallel 4 --verbose

      # 6. 部署 Qt 依赖 (windeployqt)
      - name: Deploy Qt runtime
        shell: powershell
        env:
          QT_VERSION: ${{ inputs.qt_version }}
          MSVC_ARCH: ${{ inputs.msvc_version }}
        run: |
          $QtBin = "C:\Qt\$env:QT_VERSION\$env:MSVC_ARCH\bin"
          $ExeDir = "build\Release"
          
          if (Test-Path "$ExeDir\WizNote.exe") {
            & "$QtBin\windeployqt.exe" --release --no-translations `
              --no-opengl-sw "$ExeDir\WizNote.exe"
            Write-Host "windeployqt completed"
          } else {
            Write-Error "WizNote.exe not found in $ExeDir"
            Get-ChildItem build -Recurse -Filter "WizNote.exe"
            exit 1
          }

      # 7. 拷贝 share 资源
      - name: Copy resource files
        shell: powershell
        run: |
          $ExeDir = "build\Release"
          if (Test-Path "share") {
            Copy-Item -Recurse -Force share "$ExeDir\share"
            Write-Host "share/ copied"
          }
          # OpenSSL DLL 也拷贝过去
          $OpenSslBin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path "$OpenSslBin\libcrypto-3-x64.dll") {
            Copy-Item "$OpenSslBin\libcrypto-3-x64.dll" "$ExeDir\"
            Copy-Item "$OpenSslBin\libssl-3-x64.dll" "$ExeDir\"
          }
          Get-ChildItem $ExeDir | Select-Object Name

      # 8. 打包 Release
      - name: Package release
        shell: powershell
        run: |
          $ExeDir = "build\Release"
          $ZipName = "WizNote-Windows-x64.zip"
          Compress-Archive -Path "$ExeDir\*" -DestinationPath $ZipName -Force
          Write-Host "Package created: $ZipName"
          Get-Item $ZipName | Select-Object Name, Length

      # 9. 上传 Artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizNote-Windows-x64
          path: |
            build/Release/WizNote.exe
            build/Release/*.dll
            build/Release/*.pak
            build/Release/resources
            build/Release/share
            build/Release/platforms
            build/Release/imageformats
            build/Release/styles
            build/Release/translations
            build/Release/qtwebengine_dictionaries
          if-no-files-found: warn

      # 10. 上传完整 ZIP
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizNote-Windows-x64-zip
          path: WizNote-Windows-x64.zip
          if-no-files-found: warn
