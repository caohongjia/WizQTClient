name: Build Windows EXE

on:
  push:
    branches: [master, main, 'ci-windows-build', 'trae/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to use'
        required: false
        default: '5.12.8'
        type: string

jobs:
  build-windows:
    name: Build WizNote for Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout 源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Qt 5.12 (aqt 2.x 兼容旧版 Qt)
      - name: Install Qt 5.12 via aqtinstall
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          # aqtinstall 3.x 不兼容 Qt 5.12, 固定 2.5.x
          python -m pip install "aqtinstall==2.5.*"
          
          $QtVersion = "${{ inputs.qt_version }}"
          $MsvcArch  = "msvc2017_64"
          
          Write-Host "Installing Qt $QtVersion $MsvcArch ..."
          python -m aqt install-qt windows desktop $QtVersion $MsvcArch `
            -m qtwebengine qtwebsockets qtwebchannel qtsvg qttools
          
          $QtPath = "C:\Qt\$QtVersion\$MsvcArch"
          if (-not (Test-Path "$QtPath\bin\qmake.exe")) {
            Write-Error "Qt installation failed - qmake.exe not found at $QtPath\bin\"
            exit 1
          }
          Write-Host "Qt installed at: $QtPath"
          & "$QtPath\bin\qmake.exe" --version

      # 3. 下载预编译 OpenSSL
      - name: Install OpenSSL (prebuilt)
        shell: powershell
        run: |
          $OpenSslUrl = "https://slproweb.com/download/Win64OpenSSL-1_1_1w.msi"
          $OpenSslMsi = "$env:TEMP\Win64OpenSSL.msi"
          
          Write-Host "Downloading OpenSSL ..."
          Invoke-WebRequest -Uri $OpenSslUrl -OutFile $OpenSslMsi
          
          Write-Host "Installing OpenSSL ..."
          Start-Process msiexec.exe -ArgumentList '/i', $OpenSslMsi, '/quiet', 'TARGETDIR=C:\OpenSSL' -Wait
          
          if (Test-Path "C:\OpenSSL\bin\libcrypto-1_1-x64.dll") {
            Write-Host "OpenSSL installed successfully"
          } else {
            # 尝试其他常见路径
            $found = Get-ChildItem -Path "C:\" -Filter "libcrypto*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "Found OpenSSL at: $($found.DirectoryName)"
            } else {
              Write-Warning "OpenSSL not found, build may fail"
            }
          }

      # 4. 设置 MSVC 环境 + CMake 配置
      - name: CMake Configure
        shell: cmd
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul || ^
          call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" 2>nul || ^
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvars64.bat" 2>nul || ^
          echo "vcvars64 not found, trying msbuild directly"
          
          set QT_PATH=C:\Qt\%QT_VERSION%\msvc2017_64
          set OPENSSL_ROOT=C:\OpenSSL-Win64
          if not exist "%OPENSSL_ROOT%\include" set OPENSSL_ROOT=C:\OpenSSL
          if not exist "%OPENSSL_ROOT%\include" set OPENSSL_ROOT=C:\Program Files\OpenSSL-Win64
          
          echo Qt path: %QT_PATH%
          echo OpenSSL root: %OPENSSL_ROOT%
          
          if not exist build mkdir build
          cd build
          
          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_PREFIX_PATH="%QT_PATH%" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT%" ^
            -DOPENSSL_INCLUDE_DIR="%OPENSSL_ROOT%\include" ^
            -DOPENSSL_LIBRARIES="%OPENSSL_ROOT%\lib" ^
            ..
          
          if errorlevel 1 (
            echo "CMake configure FAILED"
            exit /b 1
          )

      # 5. 编译
      - name: CMake Build
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel 4
          if errorlevel 1 (
            echo "Build FAILED"
            exit /b 1
          )
          echo "Build succeeded!"

      # 6. 部署 Qt 运行时
      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          set QT_BIN=C:\Qt\%QT_VERSION%\msvc2017_64\bin
          set EXE_DIR=build\Release
          
          if not exist "%EXE_DIR%\WizNote.exe" (
            echo "WizNote.exe not found!"
            exit /b 1
          )
          
          "%QT_BIN%\windeployqt.exe" --release --no-translations --no-opengl-sw "%EXE_DIR%\WizNote.exe"
          
          # 拷贝 OpenSSL DLL
          for %%d in (C:\OpenSSL-Win64 C:\OpenSSL "C:\Program Files\OpenSSL-Win64") do (
            if exist "%%d\bin\libcrypto-1_1-x64.dll" (
              copy /Y "%%d\bin\libcrypto-1_1-x64.dll" "%EXE_DIR%\"
              copy /Y "%%d\bin\libssl-1_1-x64.dll" "%EXE_DIR%\"
            )
          )
          
          echo "windeployqt done"
          dir "%EXE_DIR%" /B | find /c /v ""

      # 7. 拷贝 share 资源
      - name: Copy share resources
        shell: cmd
        run: |
          if exist share (
            xcopy /E /I /Y share build\Release\share
            echo "share/ copied"
          )

      # 8. 打包
      - name: Package and upload
        shell: powershell
        run: |
          $ExeDir = "build\Release"
          $ZipName = "WizNote-Windows-x64.zip"
          Compress-Archive -Path "$ExeDir\*" -DestinationPath $ZipName -Force
          Write-Host "Package: $ZipName ($((Get-Item $ZipName).Length / 1MB) MB)"

      # 9. 上传 Artifacts
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizNote-Windows-x64-exe
          path: WizNote-Windows-x64.zip
          if-no-files-found: error
