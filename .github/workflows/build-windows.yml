name: Build Windows EXE

on:
  push:
    branches: [master, main, 'ci-windows-build', 'trae/**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to use'
        required: false
        default: '5.15.2'
        type: string

jobs:
  build-windows:
    name: Build WizNote for Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout 源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Qt 5.15 via aqt（输出到 C:\Qt）
      - name: Install Qt 5.15 via aqtinstall
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.3.0"

          $QtVersion = "${{ inputs.qt_version }}"
          if ([string]::IsNullOrEmpty($QtVersion)) { $QtVersion = "5.15.2" }

          Write-Host "Installing Qt $QtVersion windows desktop win64_msvc2019_64 to C:\Qt ..."
          python -m aqt install-qt -O C:\Qt windows desktop $QtVersion win64_msvc2019_64 -m qtwebengine

          # 探测实际安装位置
          $qtRoot = "C:\Qt\$QtVersion"
          $QtPath = $null
          foreach ($archDir in Get-ChildItem $qtRoot -Directory -ErrorAction SilentlyContinue) {
            $qmake = Join-Path $archDir.FullName "bin\qmake.exe"
            if (Test-Path $qmake) {
              $QtPath = $archDir.FullName
              Write-Host "FOUND Qt at: $QtPath"
              break
            }
          }

          if (-not $QtPath) {
            $found = Get-ChildItem -Path "C:\Qt" -Filter "qmake.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $QtPath = Split-Path $found.FullName -Parent | Split-Path -Parent }
          }

          if (-not $QtPath) {
            Write-Error "FAILED: qmake.exe not found anywhere under C:\Qt!"
            exit 1
          }

          echo "QT_PATH=$QtPath" >> $env:GITHUB_ENV
          & "$QtPath\bin\qmake.exe" --version

      # 3. MSVC 环境 + CMake 配置（vswhere 定位 VS，Ninja 生成器）
      - name: CMake Configure
        shell: cmd
        env:
          QT_PATH: ${{ env.QT_PATH }}
        run: |
          echo QT_PATH=%QT_PATH%

          :: 用 vswhere 定位 VS 安装目录
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          echo VS_PATH=%VS_PATH%

          if not defined VS_PATH (
            echo vswhere did not find VS, listing candidates:
            dir "C:\Program Files\Microsoft Visual Studio" /b 2>nul
            exit /b 1
          )

          :: 导出 VS_PATH 供后续 step 使用（cmd 中 >> 前不能有空格，否则会写入尾随空格）
          echo VS_PATH=%VS_PATH%>>%GITHUB_ENV%

          :: 加载 MSVC x64 环境
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 (
            echo vcvars64.bat failed
            exit /b 1
          )
          cl 2>&1 | findstr "19" | findstr "Microsoft"

          :: 确保 Ninja 可用
          where ninja >nul 2>nul || echo "Ninja not in PATH, will rely on CMake"

          if not exist build mkdir build
          cd build

          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_PATH%" ^
            ..
          if errorlevel 1 (
            echo "CMake configure FAILED"
            exit /b 1
          )

      # 4. 编译
      - name: CMake Build
        shell: cmd
        env:
          VS_PATH: ${{ env.VS_PATH }}
        run: |
          :: 每个 step 都是独立 shell，需重新加载 MSVC 环境
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 (
            echo vcvars64.bat failed
            exit /b 1
          )
          cd build
          cmake --build . --parallel 4
          if errorlevel 1 (
            echo "Build FAILED"
            exit /b 1
          )
          echo "Build succeeded!"
          dir /s /b *.exe 2>nul

      # 5. 定位可执行文件路径
      - name: Locate WizNote.exe
        id: locate
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "WizNote.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "WizNote.exe not found under build/"
            Get-ChildItem build -ErrorAction SilentlyContinue
            exit 1
          }
          $dir = $exe.DirectoryName
          echo "EXE_DIR=$dir" >> $env:GITHUB_ENV
          Write-Host "WizNote.exe at: $dir"

      # 6. 部署 Qt 运行时
      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        env:
          QT_PATH: ${{ env.QT_PATH }}
          EXE_DIR: ${{ env.EXE_DIR }}
        run: |
          "%QT_PATH%\bin\windeployqt.exe" --release --no-translations --no-opengl-sw "%EXE_DIR%\WizNote.exe"
          if errorlevel 1 (
            echo "windeployqt failed"
            exit /b 1
          )
          echo "windeployqt done"

      # 6.5 拷贝构建产物中的第三方 DLL（如 zlib 的 zlib.dll），windeployqt 不会带出
      - name: Copy third-party DLLs
        shell: powershell
        env:
          EXE_DIR: ${{ env.EXE_DIR }}
        run: |
          $dlls = Get-ChildItem -Path build -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            $dlls | ForEach-Object {
              $dest = Join-Path $env:EXE_DIR $_.Name
              if ($_.FullName -eq $dest) {
                Write-Host "Skip $($_.Name) (already in EXE_DIR)"
              } else {
                Copy-Item $_.FullName -Destination $env:EXE_DIR -Force
                Write-Host "Copied $($_.Name) -> $env:EXE_DIR"
              }
            }
          } else {
            Write-Host "WARNING: no DLLs found under build/"
          }

      # 7. 拷贝 share 资源
      - name: Copy share resources
        shell: cmd
        env:
          EXE_DIR: ${{ env.EXE_DIR }}
        run: |
          if exist share xcopy /E /I /Y share "%EXE_DIR%\share"
          echo "share copied if present"

      # 8. 制作干净的安装源目录（排除编译中间产物 obj / CMakeFiles 等）
      - name: Prepare clean staging dir
        shell: powershell
        env:
          EXE_DIR: ${{ env.EXE_DIR }}
        run: |
          $stage = Join-Path $env:TEMP "wiznote-install"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Write-Host "Staging from $env:EXE_DIR -> $stage"
          Get-ChildItem -Path $env:EXE_DIR -Force | ForEach-Object {
            $name = $_.Name
            # 跳过编译中间产物与 CMake 生成物
            if ($name -in @('CMakeFiles','WizNote_autogen','test','__','.ninja_deps','.ninja_log','CMakeCache.txt','cmake_install.cmake')) {
              Write-Host "Skip build artifact: $name"
              return
            }
            if ($_.Extension -in @('.obj','.o','.lib')) {
              Write-Host "Skip object file: $name"
              return
            }
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }
          Write-Host "Staging completed."
          Get-ChildItem $stage | Select-Object Name

      # 9. 用 Inno Setup 生成安装程序（支持选择安装目录）
      - name: Build Inno Setup installer
        shell: powershell
        env:
          STAGE_DIR: ${{ env.TEMP }}\wiznote-install
        run: |
          # windows-latest 自带 Inno Setup 即可，若缺失则通过 choco 安装
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup -y --no-progress
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found"
            exit 1
          }
          $issScript = "$env:GITHUB_WORKSPACE\installer\WizNote-Windows-x64.iss"
          & $iscc "$issScript" "/DMyBuildDir=$env:STAGE_DIR"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\output" | Select-Object Name

      # 10. 打包便携版 zip
      - name: Package
        shell: powershell
        env:
          STAGE_DIR: ${{ env.TEMP }}\wiznote-install
        run: |
          Write-Host "Packaging from $env:STAGE_DIR"
          Compress-Archive -Path "$env:STAGE_DIR\*" -DestinationPath "WizNote-Windows-x64.zip" -Force
          Get-Item "WizNote-Windows-x64.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      # 12. 上传（安装 exe + 便携 zip）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizNote-Windows-x64
          path: |
            WizNote-Windows-x64.zip
            output/*.exe
          if-no-files-found: error

  # 14. 打 tag（v*）时自动发布 Release：附上安装 exe + 便携 zip，源码包由 GitHub 自动生成
  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built exe package
        uses: actions/download-artifact@v4
        with:
          name: WizNote-Windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/**
          generate_release_notes: true
